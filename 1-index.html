<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>תחנות הטראנס של שמעון</title>
<meta name="description" content="שבע תחנות טראנס בנגן אחד — לחיצה מנגנת בתוך הדף, עם שם השיר המתנגן איפה שזמין.">
<style>
  :root{
    --bg:#0d0b16; --card:#181527; --card-on:#221d3a; --line:#2c2650;
    --txt:#f2f0fa; --dim:#a49ec7; --accent:#a78bfa; --accent2:#e879f9; --good:#34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
    min-height:100vh; padding:18px 14px 40px;
    background-image:radial-gradient(60% 40% at 50% 0%, rgba(139,92,246,.18), transparent 70%);
  }
  .wrap{max-width:560px; margin:0 auto;}
  header{text-align:center; padding:14px 6px 20px;}
  h1{font-size:26px; font-weight:800; letter-spacing:.3px;
     background:linear-gradient(90deg,var(--accent),var(--accent2));
     -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .sub{color:var(--dim); font-size:14px; margin-top:8px; line-height:1.5;}
  .station{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px 16px; margin-bottom:12px; cursor:pointer; user-select:none;
    transition:background .2s,border-color .2s, box-shadow .2s;
  }
  .station:active{transform:scale(.99);}
  .station.playing{background:var(--card-on); border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent), 0 6px 24px rgba(139,92,246,.25);}
  .num{
    min-width:30px; height:30px; border-radius:10px; background:#241f40; color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
  }
  .info{flex:1; min-width:0;}
  .name{font-size:17px; font-weight:700;}
  .desc{color:var(--dim); font-size:12.5px; margin-top:2px;}
  .song{font-size:13.5px; margin-top:6px; color:var(--txt); line-height:1.4;
        overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .song .lbl{color:var(--good); font-weight:600;}
  .song.na{color:var(--dim); font-style:normal;}
  .playbtn{
    min-width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 4px 14px rgba(168,85,247,.4);
  }
  .playbtn svg{width:26px; height:26px; fill:#fff;}
  .station.playing .playbtn{background:#312a55; box-shadow:none; border:1px solid var(--accent);}
  .eq{display:none; align-items:flex-end; gap:3px; height:16px; margin-inline-start:8px;}
  .eq span{width:3px; background:var(--accent2); border-radius:2px; animation:eq 1s ease-in-out infinite;}
  .eq span:nth-child(2){animation-delay:.2s;} .eq span:nth-child(3){animation-delay:.4s;}
  .station.playing .eq{display:inline-flex;}
  @keyframes eq{0%,100%{height:5px}50%{height:16px}}
  .err{color:#f87171; font-size:12.5px; margin-top:4px; display:none;}
  .controls{
    position:sticky; bottom:10px; margin-top:18px;
    background:rgba(24,21,39,.92); backdrop-filter:blur(8px);
    border:1px solid var(--line); border-radius:16px; padding:12px 16px;
    display:flex; align-items:center; gap:12px;
  }
  .controls label{color:var(--dim); font-size:13px; white-space:nowrap;}
  input[type=range]{flex:1; accent-color:var(--accent); height:28px;}
  footer{margin-top:22px; text-align:center; color:var(--dim); font-size:12px; line-height:1.7;}
  .spinner{display:inline-block; width:12px; height:12px; border:2px solid var(--dim);
    border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  h2.sec{font-size:18px; margin:26px 4px 10px; color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎧 תחנות הטראנס של שמעון</h1>
    <p class="sub">לחיצה על תחנה מנגנת אותה כאן, בתוך הדף — בלי לשוניות חדשות.<br>איפה שהתחנה משדרת את שם השיר, הוא מופיע מתחת לשם התחנה.</p>
  </header>
  <div id="list"></div>
  <div class="controls">
    <label for="vol">🔊 עוצמה</label>
    <input type="range" id="vol" min="0" max="100" value="80">
  </div>
  <footer>
    רדיו חי — אין אפשרות לדלג או להריץ שירים, רק לעבור תחנה.<br>
    כל הזרמים נבדקו וחיים · 22 באוקטובר 2026 · לפעמים לוקח שנייה לניגון להתחיל
  </footer>
</div>
<audio id="player" preload="none"></audio>
<script>
const STATIONS = [
  { n:1, name:"Record Trancemission", desc:"רוסיה · טראנס", stream:"https://radiorecord.hostingradio.ru/tm96.aacp", meta:null },
  { n:2, name:"1Mix Radio Trance", desc:"בריטניה · טראנס", stream:"https://fr2.1mix.co.uk:8060/trance",
    meta: async () => { const r = await fetchJsonp("https://fr2.1mix.co.uk:8060/stats?sid=1&json=1"); return r.songtitle || null; } },
  { n:3, name:"Record Uplifting", desc:"רוסיה · אפליפטינג טראנס", stream:"https://radiorecord.hostingradio.ru/uplift96.aacp", meta:null },
  { n:4, name:"PulsRadio Trance", desc:"צרפת · טראנס", stream:"https://icecast.pulsradio.com/pulstranceHD.mp3",
    meta: async () => {
      const r = await fetchJson("https://sc5.gergosnet.com/status-json.xsl");
      const srcs = [].concat(r.icestats.source || []);
      const s = srcs.find(x => (x.listenurl||"").endsWith("/pulstranceHD.mp3"));
      return (s && (s.title || s.server_name)) || null;
    } },
  { n:5, name:"A State of Trance 24/7", desc:"ארמין ואן ביורן · 24/7", stream:"https://radiorecord.hostingradio.ru/asot96.aacp", meta:null },
  { n:6, name:"TrancePulse Dublin", desc:"אירלנד · טראנס", stream:"https://stream.trance.ie/mp3",
    meta: async () => {
      const r = await fetchJson("https://stream.trance.ie/status-json.xsl");
      const srcs = [].concat(r.icestats.source || []);
      const s = srcs.find(x => (x.listenurl||"").endsWith("/mp3"));
      return (s && (s["display-title"] || s.title)) || null;
    } },
  { n:7, name:"Radio Anima Amoris", desc:"רוסיה · טראנס מלודי", stream:"https://amoris.sknt.ru/trance",
    meta: async () => {
      const t = await fetchText("https://amoris.sknt.ru/trance/stats.json");
      const m = t.match(/metadata\.trance\((.*)\)\s*;?\s*$/s);
      if (!m) return null;
      const r = JSON.parse(m[1]);
      return (r.songtitle || "").replace(/\s*[-–]\s*Anima Amoris\s*$/i,"") || null;
    } },
  { n:8, section:"🎤 טראנס ווקאלי (עם שירה)", name:"Sunshine Live Vocal Trance", desc:"גרמניה · ווקאל טראנס", stream:"https://sunsl.streamabc.net/sunsl-vocaltrance-mp3-192-5826863", meta:null },
  { n:9, name:"Technolovers Vocal Trance", desc:"גרמניה · ווקאל טראנס", stream:"https://stream.technolovers.fm/vocal-trance", meta:null },
  { n:10, name:"DFM Vocal Trance", desc:"רוסיה · ווקאל טראנס", stream:"https://dfm-trance.hostingradio.ru/trance96.aacp", meta:null },
  { n:11, name:"Radioparty Vocal Trance", desc:"פולין · ווקאל טראנס", stream:"https://s2.radioparty.pl:8025/vocaltrance",
    meta: async () => {
      const r = await fetchJson("https://s2.radioparty.pl:8025/status-json.xsl");
      const srcs = [].concat(r.icestats.source || []);
      const s = srcs.find(x => (x.listenurl||"").endsWith("/vocaltrance"));
      return (s && (s.yp_currently_playing || s.title)) || null;
    } },
];

const audio = document.getElementById("player");
const list = document.getElementById("list");
let current = -1;

function withTimeout(ms){
  const c = new AbortController();
  setTimeout(()=>c.abort(), ms);
  return c.signal;
}
async function fetchJson(url){
  const r = await fetch(url, {signal: withTimeout(9000), cache:"no-store"});
  if (!r.ok) throw new Error("http "+r.status);
  return r.json();
}
async function fetchText(url){
  const r = await fetch(url, {signal: withTimeout(9000), cache:"no-store"});
  if (!r.ok) throw new Error("http "+r.status);
  return r.text();
}
function fetchJsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = "jsonp_" + Math.random().toString(36).slice(2) + Date.now();
    const s = document.createElement("script");
    let done = false;
    const cleanup = ()=>{ try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove(); };
    window[cb] = (d)=>{ done=true; cleanup(); resolve(d); };
    s.onerror = ()=>{ if(!done){ cleanup(); reject(new Error("jsonp error")); } };
    s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
    document.head.appendChild(s);
    setTimeout(()=>{ if(!done){ cleanup(); reject(new Error("jsonp timeout")); } }, 9000);
  });
}

STATIONS.forEach((st,i)=>{
  if (st.section){ const h=document.createElement("h2"); h.className="sec"; h.textContent=st.section; list.appendChild(h); }
  const el = document.createElement("div");
  el.className = "station"; el.id = "st"+i; el.setAttribute("role","button"); el.setAttribute("tabindex","0");
  el.innerHTML = `
    <div class="num">${st.n}</div>
    <div class="info">
      <div class="name">${st.name}<span class="eq"><span></span><span></span><span></span></span></div>
      <div class="desc">${st.desc}</div>
      <div class="song" id="song${i}"></div>
      <div class="err" id="err${i}">הזרם לא זמין כרגע — נסה שוב בעוד רגע</div>
    </div>
    <button class="playbtn" aria-label="נגן ${st.name}">
      <svg viewBox="0 0 24 24" class="ic-play"><path d="M8 5v14l11-7z"/></svg>
      <svg viewBox="0 0 24 24" class="ic-pause" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>`;
  el.addEventListener("click", ()=>toggle(i));
  el.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault(); toggle(i);} });
  list.appendChild(el);
});

function setSong(i, html, na){
  const el = document.getElementById("song"+i);
  el.innerHTML = html;
  el.classList.toggle("na", !!na);
}
async function refreshMeta(){
  for (let i=0;i<STATIONS.length;i++){
    const st = STATIONS[i];
    if (!st.meta){ setSong(i,"רדיו חי · שם השיר לא זמין לתחנה זו", true); continue; }
    if (!st._tried){ setSong(i,'<span class="spinner"></span> בודק שם שיר…', true); }
    try {
      const t = await st.meta();
      st._tried = true;
      setSong(i, t ? `<span class="lbl">מתנגן כעת:</span> ${escapeHtml(t)}` : "שם השיר לא זמין כרגע", !t);
    } catch(e){
      st._tried = true;
      setSong(i,"שם השיר לא זמין כרגע", true);
    }
  }
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function updateUI(){
  STATIONS.forEach((st,i)=>{
    const card = document.getElementById("st"+i);
    const playing = (i===current && !audio.paused);
    card.classList.toggle("playing", playing);
    card.querySelector(".ic-play").style.display = playing ? "none" : "";
    card.querySelector(".ic-pause").style.display = playing ? "" : "none";
  });
}
function toggle(i){
  if (current===i && !audio.paused){ audio.pause(); return; }
  play(i);
}
function play(i){
  current = i;
  const st = STATIONS[i];
  document.getElementById("err"+i).style.display="none";
  if (audio.src !== st.stream) audio.src = st.stream;
  audio.play().catch(()=>{ document.getElementById("err"+i).style.display="block"; });
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({ title: st.name, artist: "תחנות הטראנס של שמעון" });
  }
  updateUI();
}
audio.addEventListener("play", updateUI);
audio.addEventListener("pause", updateUI);
audio.addEventListener("error", ()=>{ if(current>=0){ document.getElementById("err"+current).style.display="block"; } updateUI(); });
if ("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play", ()=>{ if(current<0) play(0); else audio.play(); });
  navigator.mediaSession.setActionHandler("pause", ()=>audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", ()=>play((current-1+STATIONS.length)%STATIONS.length));
  navigator.mediaSession.setActionHandler("nexttrack", ()=>play((current+1)%STATIONS.length));
}
document.getElementById("vol").addEventListener("input", e=>{ audio.volume = e.target.value/100; });
audio.volume = 0.8;

refreshMeta();
setInterval(refreshMeta, 25000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refreshMeta(); });
</script>
</body>
</html>
